services:
  postgres:
    image: postgres:14
    container_name: patrimonio_postgres
    restart: always
    environment:
      POSTGRES_DB: patrimonio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - patrimonio_pgdata:/var/lib/postgresql/data

volumes:
  patrimonio_pgdata: